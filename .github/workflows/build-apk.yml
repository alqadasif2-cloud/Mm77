name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Ensure all build source files exist
        run: |
          if [ ! -f "src/components/quotes/QuotesView.tsx" ] || [ ! -f "src/components/trade/TradeView.tsx" ] || [ ! -f "src/components/modals/OtpModal.tsx" ] || [ ! -f "src/types/mt5.ts" ]; then
            echo "Missing components detected, auto-restoring from upstream..."
            git clone --depth 1 https://github.com/alqadasif2-cloud/Mm55.git /tmp/source_repo
            mkdir -p src/components/quotes src/components/trade src/components/modals src/types
            [ -f "src/components/quotes/QuotesView.tsx" ] || cp /tmp/source_repo/src/components/quotes/QuotesView.tsx src/components/quotes/
            [ -f "src/components/trade/TradeView.tsx" ] || cp /tmp/source_repo/src/components/trade/TradeView.tsx src/components/trade/
            [ -f "src/components/modals/OtpModal.tsx" ] || cp /tmp/source_repo/src/components/modals/OtpModal.tsx src/components/modals/
            [ -f "src/types/mt5.ts" ] || cp /tmp/source_repo/src/types/mt5.ts src/types/
            rm -rf /tmp/source_repo
            echo "Source files successfully restored!"
          fi
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace
      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'mt5release123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mt5' }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            keytool -genkeypair -keystore release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=MetaTrader 5, O=MT5, C=US"
          fi
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build-tools: $BT"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "Error: No APK was generated in android/app/build/outputs/apk/release!"
            exit 1
          fi
          mkdir -p release-apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" --ks-key-alias "$KEY_ALIAS" --out release-apk/MetaTrader-5.apk aligned.apk
          "$BT/apksigner" verify release-apk/MetaTrader-5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MetaTrader-5-APK
          path: release-apk/MetaTrader-5.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MetaTrader 5 APK v1.0.${{ github.run_number }}
          files: release-apk/MetaTrader-5.apk
        continue-on-error: true
